<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Percentage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>

    <h1>Love Percentage Calculator</h1>
    <p class="subtitle">Check love percentage in both directions</p>

    <div class="input-box">
        <label>👦 Boy Name</label>
        <input type="text" id="boyName" placeholder="Enter boy name">
    </div>

    <div class="input-box">
        <label>👧 Girl Name</label>
        <input type="text" id="girlName" placeholder="Enter girl name">
    </div>

    <div class="buttons">
        <button onclick="calculateLove('boyGirl')">
            👦 Boy → Girl 👧
        </button>

        <button onclick="calculateLove('girlBoy')">
            👧 Girl → Boy 👦
        </button>
    </div>

    <div id="result" class="result hidden">
        <div id="direction"></div>
        <div id="names"></div>
        <div id="percentage">0%</div>
        <div id="message"></div>
    </div>

    <button class="both-btn" onclick="calculateBoth()">
        💕 Check Both
    </button>

    <div id="bothResults" class="both-results hidden"></div>
</div>

<script src="script.js"></script>

</body>
</html>
